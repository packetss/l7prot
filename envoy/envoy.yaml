# ============================================================================
#  Envoy edge config — custom L7 DDoS protection (single-node edition)
#
#  Design rule: cheapest filter that can kill the request goes first.
#
#    tls_inspector      -> TLS/SNI + JA4 fingerprint (listener filter)
#    lua (custom)       -> per-IP token bucket, UA heuristics, blocklist
#    local_ratelimit    -> per-connection backstop, no deps
#    coraza (WAF)       -> OWASP CRS virtual patching (WASM)
#    cache              -> absorb repeated GETs, origin never sees them
#    router             -> origin on 127.0.0.1:8080
#
#  JA4 is computed by tls_inspector and logged via %TLS_JA4_FINGERPRINT%.
#  It is NOT accessible from the Lua filter — Lua-side checks use other
#  signals (UA, rate, suspicion scoring). JA4 is for log analysis / offline.
#
#  Admin on 127.0.0.1:9901 — this is what the future dashboard reads.
# ============================================================================

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

# Bound the total number of concurrent downstream connections across all
# listeners. Without this Envoy logs:
#
#   There is no configured limit to the number of allowed active downstream
#   connections. Configure a limit in
#   'envoy.resource_monitors.global_downstream_max_connections' resource monitor.
#
# and under a connection flood it will happily allocate until the kernel
# OOM killer takes the process down (observed: status=9/KILL).
#
# SIZING (2GB / 2 core box):
#
#   The limit must be derived from RAM, not picked for looks. Each
#   connection costs roughly:
#     per_connection_buffer_limit_bytes (32KB, set below)
#     + ~30KB of Envoy per-connection state (codec, header map, filters)
#     + TLS session/handshake state
#     = ~62KB per connection, so 20k connections would be ~1.2GB of
#     buffer alone -- more than this box has, which is how Envoy ended up
#   as the OOM-killer victim in the first place.
#
#   6000 conns x 62KB ~= 370MB, which leaves room for Envoy's baseline
#   footprint, the origin, the dashboard and the OS inside MemoryMax=768M.
#
#   This is a BACKSTOP. The primary defence is the nftables layer
#   (scripts/harden.sh), which sheds connections before they cost anything.
#   With that in place, bots never fill these slots and real users keep
#   their capacity.
overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 6000

static_resources:
  listeners:

  # --------------------------------------------------------------------------
  # :80 — ACME HTTP-01 + redirect everything else to HTTPS
  # --------------------------------------------------------------------------
  - name: http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 80 }
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: http_80
              route_config:
                name: local_route
                virtual_hosts:
                  - name: backend
                    domains: ["*"]
                    routes:
                      # ACME HTTP-01 challenges are proxied to the origin,
                      # which serves them from the certbot webroot. This lets
                      # certs renew without stopping Envoy (no downtime).
                      - match: { prefix: "/.well-known/acme-challenge/" }
                        route:
                          cluster: origin
                          timeout: 10s
                      - match: { prefix: "/" }
                        redirect:
                          https_redirect: true
                          response_code: MOVED_PERMANENTLY
              http_filters:
                - name: envoy.filters.http.router
                  typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  # --------------------------------------------------------------------------
  # :443 — the real edge
  # --------------------------------------------------------------------------
  - name: https_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 443 }
    # tls_inspector is a LISTENER filter — runs before the network filter
    # chain so SNI is available for filter chain matching and JA4 fingerprint
    # is computed and stored on the connection for access logging.
    listener_filters:
      - name: envoy.filters.listener.tls_inspector
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
          enable_ja4_fingerprinting: true
    filter_chains:
      - transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_params:
                tls_minimum_protocol_version: TLSv1_2
              tls_certificates:
                - certificate_chain: { filename: /etc/letsencrypt/live/filterz.xyz/fullchain.pem }
                  private_key: { filename: /etc/letsencrypt/live/filterz.xyz/privkey.pem }
              # ALPN offers h2 and http/1.1.
              #
              # NOTE: h2 is KEPT deliberately, against the advice to drop it.
              # HTTP/2 multiplexes many requests over ONE connection, so a
              # real browser uses ~1 socket instead of ~6. Dropping h2 would
              # push every legitimate user onto http/1.1 and MULTIPLY our
              # connection count -- the opposite of what a 2GB box wants.
              #
              # The real risk of h2 is that one connection can carry
              # thousands of concurrent streams, i.e. a request flood over a
              # single socket. That is bounded precisely below with
              # http2_max_concurrent_streams rather than by disabling h2.
              alpn_protocols: ["h2", "http/1.1"]
        filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: https_edge
              codec_type: AUTO

              # Cap concurrent HTTP/2 streams per connection. Without this a
              # single attacker connection can have thousands of streams in
              # flight, which bypasses per-connection limits and burns
              # memory on per-stream state. 100 is far above what a browser
              # uses for a normal page load.
              http2_protocol_options:
                max_concurrent_streams: 100
                initial_stream_window_size: 65535
                initial_connection_window_size: 1048576

              common_http_protocol_options:
                # Shorter than the previous 300s/60s so connection slots
                # recycle quickly during a flood. Idle connections are the
                # cheapest thing for an attacker to hold open.
                idle_timeout: 30s
                max_connection_duration: 60s
                max_requests_per_connection: 1000
                headers_with_underscores_action: REJECT_REQUEST

              # No trusted proxies in front — Magic Transit is L3/L4 only
              # (transparent to HTTP). xff_num_trusted_hops MUST be 0 here:
              # any nonzero value lets an attacker spoof their IP via XFF
              # and bypass the rate limiter.
              use_remote_address: true
              xff_num_trusted_hops: 0

              route_config:
                name: edge_routes
                virtual_hosts:
                  - name: backend
                    domains: ["*"]
                    routes:
                      # Dashboard routes - proxied to localhost:8888
                      - match: { prefix: "/dashboard" }
                        route:
                          cluster: dashboard
                          timeout: 30s
                      - match: { prefix: "/api/stats" }
                        route:
                          cluster: dashboard
                          timeout: 30s
                      - match: { prefix: "/api/events" }
                        route:
                          cluster: dashboard
                          timeout: 30s
                      - match: { prefix: "/api/public-stats" }
                        route:
                          cluster: dashboard
                          timeout: 30s
                      - match: { prefix: "/api/logout" }
                        route:
                          cluster: dashboard
                          timeout: 30s
                      # Default route - origin
                      - match: { prefix: "/" }
                        route:
                          cluster: origin
                          retry_policy:
                            retry_on: "5xx,reset,connect-failure,refused-stream"
                            num_retries: 1
                            per_try_timeout: 2s

              http_filters:
                # ---- 1. CUSTOM per-IP limiting (this is the interesting bit)
                #      Full control, lives in envoy/lua/edge_guard.lua
                - name: envoy.filters.http.lua
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    default_source_code:
                      filename: /etc/envoy/lua/edge_guard.lua

                # ---- 2. per-connection backstop ------------------------------
                # This is a GLOBAL token bucket (not per-IP), so it is a
                # coarse overload valve rather than a per-source limit --
                # the per-source limits live in nftables (scripts/harden.sh)
                # and in the Lua filter.
                #
                # The bucket is sized so that normal browsing traffic never
                # touches it, but a genuine request flood on a single
                # connection exhausts it fast.
                - name: envoy.filters.http.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: http_local_rate_limit
                    # 503 + Retry-After rather than a TCP reset: a reset
                    # surfaces to the user as ERR_CONNECTION_RESET and they
                    # assume the site is down. A 503 reads as "busy, try
                    # again" while protecting us just as well.
                    status: { code: ServiceUnavailable }
                    token_bucket:
                      max_tokens: 2000
                      tokens_per_fill: 2000
                      fill_interval: 1s
                    filter_enabled:
                      default_value: { numerator: 100, denominator: HUNDRED }
                    filter_enforced:
                      default_value: { numerator: 100, denominator: HUNDRED }

                # ---- 3. WAF (Coraza) — disabled during active flood attack.
                # Re-enable by restoring the envoy.filters.http.wasm block.
                # Costs too much WASM memory under volumetric attack.

                # ---- 4. cache (in-memory, single node) ----------------------
                - name: envoy.filters.http.cache
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.cache.v3.CacheConfig
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.cache.simple_http_cache.v3.SimpleHttpCacheConfig

                # ---- 5. route to origin ------------------------------------
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      json_format:
                        ts: "%START_TIME%"
                        ip: "%DOWNSTREAM_REMOTE_ADDRESS%"
                        ja4: "%TLS_JA4_FINGERPRINT%"
                        ua: "%REQ(USER-AGENT)%"
                        method: "%REQ(:METHOD)%"
                        uri: "%REQ(:PATH)%"
                        status: "%RESPONSE_CODE%"
                        flags: "%RESPONSE_FLAGS%"
                        dur_ms: "%DURATION%"
                        bytes: "%BYTES_SENT%"

  # --------------------------------------------------------------------------
  # clusters
  # --------------------------------------------------------------------------
  clusters:
    # Origin - the backend application
    - name: origin
      type: STATIC
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: origin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8080 }
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 512
            max_pending_requests: 1024
            max_requests: 4096
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check: { path: /healthz }

    # Dashboard - real-time attack monitoring UI
    - name: dashboard
      type: STATIC
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: dashboard
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8888 }

layered_runtime:
  layers:
    - name: static
      static_layer:
        envoy.filters.http.cache.filter_enabled:
          default_value: { numerator: 100, denominator: HUNDRED }
