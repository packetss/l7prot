# ============================================================================
#  Envoy edge config — custom L7 DDoS protection (single-node edition)
#
#  Design rule: cheapest filter that can kill the request goes first.
#
#    tls_inspector      -> TLS/SNI + JA4 fingerprint (listener filter)
#    lua (custom)       -> per-IP token bucket, UA heuristics, blocklist
#    local_ratelimit    -> per-connection backstop, no deps
#    coraza (WAF)       -> OWASP CRS virtual patching (WASM)
#    cache              -> absorb repeated GETs, origin never sees them
#    router             -> origin on 127.0.0.1:8080
#
#  JA4 is computed by tls_inspector and logged via %TLS_JA4_FINGERPRINT%.
#  It is NOT accessible from the Lua filter — Lua-side checks use other
#  signals (UA, rate, suspicion scoring). JA4 is for log analysis / offline.
#
#  Admin on 127.0.0.1:9901 — this is what the future dashboard reads.
# ============================================================================

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

static_resources:
  listeners:

  # --------------------------------------------------------------------------
  # :80 — ACME HTTP-01 + redirect everything else to HTTPS
  # --------------------------------------------------------------------------
  - name: http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 80 }
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: http_80
              route_config:
                name: local_route
                virtual_hosts:
                  - name: backend
                    domains: ["*"]
                    routes:
                      - match: { prefix: "/.well-known/acme-challenge/" }
                        direct_response: { status: 200, body: { inline_string: "ok" } }
                      - match: { prefix: "/" }
                        redirect:
                          https_redirect: true
                          response_code: MOVED_PERMANENTLY
              http_filters:
                - name: envoy.filters.http.router
                  typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  # --------------------------------------------------------------------------
  # :443 — the real edge
  # --------------------------------------------------------------------------
  - name: https_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 443 }
    # tls_inspector is a LISTENER filter — runs before the network filter
    # chain so SNI is available for filter chain matching and JA4 fingerprint
    # is computed and stored on the connection for access logging.
    listener_filters:
      - name: envoy.filters.listener.tls_inspector
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
          enable_ja4_fingerprinting: true
    filter_chains:
      - transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_params:
                tls_minimum_protocol_version: TLSv1_2
              tls_certificates:
                - certificate_chain: { filename: /etc/letsencrypt/live/filterz.xyz/fullchain.pem }
                  private_key: { filename: /etc/letsencrypt/live/filterz.xyz/privkey.pem }
              alpn_protocols: ["h2", "http/1.1"]
        filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: https_edge
              codec_type: AUTO

              common_http_protocol_options:
                idle_timeout: 60s
                max_connection_duration: 300s
                headers_with_underscores_action: REJECT_REQUEST

              # No trusted proxies in front — Magic Transit is L3/L4 only
              # (transparent to HTTP). xff_num_trusted_hops MUST be 0 here:
              # any nonzero value lets an attacker spoof their IP via XFF
              # and bypass the rate limiter.
              use_remote_address: true
              xff_num_trusted_hops: 0

              route_config:
                name: edge_routes
                virtual_hosts:
                  - name: backend
                    domains: ["*"]
                    routes:
                      # Dashboard route - proxied to localhost:8888
                      - match: { prefix: "/dashboard" }
                        route:
                          cluster: dashboard
                          timeout: 30s
                      # Default route - origin
                      - match: { prefix: "/" }
                        route:
                          cluster: origin
                          retry_policy:
                            retry_on: "5xx,reset,connect-failure,refused-stream"
                            num_retries: 1
                            per_try_timeout: 2s

              http_filters:
                # ---- 1. CUSTOM per-IP limiting (this is the interesting bit)
                #      Full control, lives in envoy/lua/edge_guard.lua
                - name: envoy.filters.http.lua
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    default_source_code:
                      filename: /etc/envoy/lua/edge_guard.lua

                # ---- 2. per-connection backstop ------------------------------
                - name: envoy.filters.http.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: http_local_rate_limit
                    token_bucket:
                      max_tokens: 200
                      tokens_per_fill: 200
                      fill_interval: 1s
                    filter_enabled:
                      default_value: { numerator: 100, denominator: HUNDRED }
                    filter_enforced:
                      default_value: { numerator: 100, denominator: HUNDRED }

                # ---- 3. WAF (Coraza, via WASM) ---------------------------
                # coraza-proxy-wasm: https://github.com/corazawaf/coraza-proxy-wasm
                # CRS is bundled in the wasm binary — Include @owasp_crs/*.conf
                - name: envoy.filters.http.wasm
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                    config:
                      name: "coraza-filter"
                      root_id: ""
                      configuration:
                        "@type": "type.googleapis.com/google.protobuf.StringValue"
                        value: |
                          {
                            "directives_map": {
                              "default": [
                                "SecRuleEngine On",
                                "SecRequestBodyAccess On",
                                "SecRequestBodyLimit 1048576",
                                "SecRequestBodyNoFilesLimit 1048576",
                                "SecRequestBodyLimitAction Reject",
                                "SecResponseBodyAccess Off",
                                "SecAuditEngine On",
                                "SecAuditLogRelevantStatus \"^(?:5[0-9]{2}|4[0-9][0-35-9]|4[1-9]4)\"",
                                "SecAuditLog /dev/stdout",
                                "SecRule REQUEST_URI \"@rx (?:\\\\.\\\\.[\\\\/]|%2e%2e%2f|\\\\x00|php://|data://|expect://)\" \"id:100005,phase:1,deny,status:400,log,msg:'Malicious path',severity:'CRITICAL',tag:'custom-traversal'\"",
                                "SecRule REQUEST_METHOD \"!@rx ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$\" \"id:100003,phase:1,deny,status:405,log,msg:'Method not allowed',severity:'WARNING',tag:'custom-method'\"",
                                "SecRule REQUEST_HEADERS:Content-Length \"@gt 1048576\" \"id:100004,phase:1,deny,status:413,log,msg:'Request body too large',severity:'WARNING',tag:'custom-size'\"",
                                "SecRule &REQUEST_HEADERS:X-Forwarded-For \"@gt 10\" \"id:100006,phase:1,deny,status:400,log,msg:'Header chain abuse',severity:'WARNING',tag:'custom-abuse'\"",
                                "Include @crs-setup-conf",
                                "Include @owasp_crs/*.conf"
                              ]
                            },
                            "default_directives": "default"
                          }
                      vm_config:
                        runtime: "envoy.wasm.runtime.v8"
                        vm_id: "coraza-filter_vm_id"
                        code:
                          local:
                            filename: /usr/local/lib/coraza-proxy-wasm.wasm

                # ---- 4. cache (in-memory, single node) ----------------------
                - name: envoy.filters.http.cache
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.cache.v3.CacheConfig
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.cache.simple_http_cache.v3.SimpleHttpCacheConfig

                # ---- 5. route to origin ------------------------------------
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      json_format:
                        ts: "%START_TIME%"
                        ip: "%DOWNSTREAM_REMOTE_ADDRESS%"
                        ja4: "%TLS_JA4_FINGERPRINT%"
                        ua: "%REQ(USER-AGENT)%"
                        method: "%REQ(:METHOD)%"
                        uri: "%REQ(:PATH)%"
                        status: "%RESPONSE_CODE%"
                        flags: "%RESPONSE_FLAGS%"
                        dur_ms: "%DURATION%"
                        bytes: "%BYTES_SENT%"

  # --------------------------------------------------------------------------
  # clusters
  # --------------------------------------------------------------------------
  clusters:
    # Origin - the backend application
    - name: origin
      type: STATIC
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: origin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8080 }
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 512
            max_pending_requests: 1024
            max_requests: 4096
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check: { path: /healthz }

    # Dashboard - real-time attack monitoring UI
    - name: dashboard
      type: STATIC
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: dashboard
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8888 }

layered_runtime:
  layers:
    - name: static
      static_layer:
        envoy.filters.http.cache.filter_enabled:
          default_value: { numerator: 100, denominator: HUNDRED }
