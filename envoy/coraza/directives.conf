# Coraza directives — the engine behaviour (audit log, anomaly scoring, rules)
#
# This is a deliberately conservative starting point. Detection-only first
# so you can see what WOULD be blocked before it blocks anything.

# ---- Audit logging ----
SecAuditEngine On
SecAuditLogRelevantStatus "^(?:5[0-9]{2}|4[0-9][0-35-9]|4[1-9]4)"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /dev/stdout

# ---- Anomaly scoring ----
# ModSecurity-style: rules raise a score, we block when the total passes
# the threshold. Much safer than blocking on the first match.
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia=1"
SecAction "id:900001,phase:2,nolog,pass,t:none,setvar:tx.blocking_paranoia=1"

# ---- Request body handling ----
# Allow coraza to inspect bodies, but cap what it buffers so a huge upload
# cannot be used to exhaust memory.
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

# ---- Response body ----
SecResponseBodyAccess Off
SecResponseBodyMimeType Off
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# ---- Files ----
SecTmpDir /tmp
SecDataDir /tmp

# ---- Allowlisting / skipping ----
# Never WAF-inspect your own monitoring and ACME paths.
SecRule REQUEST_URI "@beginsWith /.well-known/acme-challenge/" \
  "id:900010,phase:1,nolog,pass,t:none,skipAfter:END"
SecRule REQUEST_URI "@streq /healthz" \
  "id:900011,phase:1,nolog,pass,t:none,skipAfter:END"

SecMarker END
