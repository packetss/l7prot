# ===========================================================================
#  Custom L7 rules for Coraza.
#
#  These sit in FRONT of the OWASP CRS (loaded first via Include), so they
#  get first crack at the request. Everything here is about DDoS and abuse
#  rather than traditional injection, because that is the problem we solve.
# ===========================================================================

# ---- Abuse of expensive endpoints -----------------------------------------
# Anything hitting these paths in bulk is costing us origin CPU. Rate-limit
# them harder than the general path.
SecRule REQUEST_URI "@rx ^/(api/(submit|login|register|signup)|wp-login\.php|wp-admin)" \
  "id:100001,phase:1,log,pass,nolog,t:none,t:normalization,\
   msg:'Abuse endpoint hit',severity:'NOTICE',tag:'custom-abuse',\
   setvar:tx.abuse_endpoint=1"

# ---- Missing or obviously fake User-Agent ---------------------------------
SecRule REQUEST_HEADERS:User-Agent "!@rx ^(Mozilla|Dalvik|CFNetwork|okhttp)" \
  "id:100002,phase:1,log,pass,nolog,t:none,\
   msg:'Unusual or missing User-Agent',severity:'NOTICE',tag:'custom-bot'"

# ---- HTTP method filtering -------------------------------------------------
# Only allow methods a normal site needs.
SecRule REQUEST_METHOD "!@rx ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$" \
  "id:100003,phase:1,deny,status:405,log,\
   msg:'Method not allowed',severity:'WARNING',tag:'custom-method'"

# ---- Oversized request bodies ---------------------------------------------
SecRule REQUEST_HEADERS:Content-Length "@gt 1048576" \
  "id:100004,phase:1,deny,status:413,log,\
   msg:'Request body too large',severity:'WARNING',tag:'custom-size'"

# ---- Suspicious paths ------------------------------------------------------
# Path traversal, encoded traversal, null bytes, php wrappers.
SecRule REQUEST_URI "@rx (?:\\.\\./|%2e%2e%2f|\\x00|php://|data://|expect://)" \
  "id:100005,phase:1,deny,status:400,log,\
   msg:'Malicious path',severity:'CRITICAL',tag:'custom-traversal'"

# ---- Too many forwarded headers -------------------------------------------
SecRule &REQUEST_HEADERS:X-Forwarded-For "@gt 10" \
  "id:100006,phase:1,deny,status:400,log,\
   msg:'Header chain abuse (XFF spam)',severity:'WARNING',tag:'custom-abuse'"

# ---- Empty Host header -----------------------------------------------------
SecRule REQUEST_HEADERS:Host "!@rx ^[^ ]+$" \
  "id:100007,phase:1,deny,status:400,log,\
   msg:'Invalid Host header',severity:'WARNING',tag:'custom-abuse'"
