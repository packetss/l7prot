<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>filterz.xyz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Courier New', monospace;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 3s infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.container {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 1000px;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3rem;
}

.globe {
  width: 300px;
  height: 300px;
  position: relative;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.6));
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-30px); }
}

.globe-sphere {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(0, 255, 136, 0.3) 0%, rgba(0, 204, 255, 0.1) 40%, transparent 70%);
  border: 2px solid rgba(0, 255, 136, 0.3);
  position: relative;
  overflow: hidden;
}

.globe-sphere::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0, 204, 255, 0.1) 0%, transparent 50%);
  animation: globeSpin 20s linear infinite;
}

@keyframes globeSpin {
  0% { transform: rotateZ(0deg); }
  100% { transform: rotateZ(360deg); }
}

.globe-ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 50%;
  animation: rotateRing 10s linear infinite;
}

@keyframes rotateRing {
  0% { transform: rotateX(80deg) rotateZ(0deg); }
  100% { transform: rotateX(80deg) rotateZ(360deg); }
}

.pulse-ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 1px solid rgba(0, 255, 136, 0.3);
  border-radius: 50%;
  animation: pulseRing 2s ease-out infinite;
}

@keyframes pulseRing {
  0% {
    width: 100%;
    height: 100%;
    opacity: 1;
    border-color: rgba(0, 255, 136, 0.8);
  }
  100% {
    width: 150%;
    height: 150%;
    opacity: 0;
    border-color: rgba(0, 255, 136, 0);
  }
}

.content {
  display: flex;
  flex-direction: column;
  gap: 2rem;
  align-items: center;
}

h1 {
  font-size: 2.2rem;
  background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.stat-section {
  display: flex;
  gap: 2rem;
  justify-content: center;
  flex-wrap: wrap;
}

.stat-group {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  padding: 2rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  min-width: 200px;
}

.group-title {
  color: #00ff88;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-weight: 600;
  margin-bottom: 0.5rem;
  border-bottom: 1px solid rgba(0, 255, 136, 0.2);
  padding-bottom: 0.75rem;
}

.stat-group.peak .group-title {
  color: #00ccff;
  border-bottom-color: rgba(0, 204, 255, 0.2);
}

.stat-group.danger .group-title {
  color: #ff0055;
  border-bottom-color: rgba(255, 0, 85, 0.2);
}

.stat {
  text-align: center;
}

.stat-label {
  color: #6e7681;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 900;
  color: #00ff88;
  text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  margin-bottom: 0.25rem;
  line-height: 1;
}

.stat.danger .stat-value {
  color: #ff0055;
  text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
}

.stat-unit {
  color: #6e7681;
  font-size: 0.75rem;
}

.narrative {
  max-width: 700px;
  line-height: 1.8;
  color: #8b949e;
  font-size: 0.95rem;
  animation: fadeIn 1s ease 0.5s backwards;
}

.narrative-threat {
  color: #00ff88;
  font-weight: bold;
}

.narrative-danger {
  color: #ff0055;
  font-weight: bold;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #00ff88;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 2rem;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  background: #00ff88;
  border-radius: 50%;
  animation: pulse 1s infinite;
  box-shadow: 0 0 10px #00ff88;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

@media (max-width: 768px) {
  .globe { width: 200px; height: 200px; }
  h1 { font-size: 1.5rem; }
  .stat-value { font-size: 2.5rem; }
  .stat-section { gap: 2rem; }
  .narrative { font-size: 0.85rem; }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <div class="globe">
    <div class="globe-sphere">
      <div class="globe-ring"></div>
      <div class="pulse-ring"></div>
    </div>
  </div>

  <div class="content">
    <h1>filterz.xyz</h1>

    <div class="stat-section">
      <div class="stat-group">
        <div class="group-title">Live Requests</div>
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="stat-live">0</div>
          <div class="stat-unit">per second</div>
        </div>
        <div class="stat danger">
          <div class="stat-label">Blocked</div>
          <div class="stat-value" id="stat-threats">0</div>
          <div class="stat-unit">per second</div>
        </div>
      </div>

      <div class="stat-group peak">
        <div class="group-title">Peak Requests (1min)</div>
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="stat-peak-rps">0</div>
          <div class="stat-unit">per second</div>
        </div>
        <div class="stat danger">
          <div class="stat-label">Blocked</div>
          <div class="stat-value" id="stat-peak-blocked">0</div>
          <div class="stat-unit">per second</div>
        </div>
      </div>

      <div class="stat-group danger">
        <div class="group-title">Last Hour</div>
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="stat-hour-total">0</div>
          <div class="stat-unit">requests</div>
        </div>
        <div class="stat danger">
          <div class="stat-label">Blocked</div>
          <div class="stat-value" id="stat-hour-blocked">0</div>
          <div class="stat-unit">requests</div>
        </div>
      </div>
    </div>

    <div class="status">
      <span class="pulse-dot"></span>
      Shield Active
    </div>
  </div>
</div>

<script>
function generateStars() {
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 2 + 'px';
    star.style.height = star.style.width;
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
  }
}

generateStars();

async function updateStats() {
  // Don't stack polls: if the last request is still in flight, skip this tick.
  // Without this, a slow response causes requests to pile up every interval.
  if (window.statsInFlight) return;
  window.statsInFlight = true;

  try {
    const resp = await fetch('/api/public-stats', { cache: 'no-store' });
    if (!resp.ok) throw new Error('Stats API error');

    const data = await resp.json();
    const stats = data.stats || {};

    const total = stats.requests_total || 0;
    const blocked = (stats.ip_blocked || 0) + (stats.ua_blocked || 0) + (stats.suspicious_blocked || 0);
    const ratelimited = stats.rate_limited || 0;
    const success = stats.success_2xx || 0;

    const threats = blocked + ratelimited;

    // Track delta since last poll for live request count
    if (!window.prevTotal) window.prevTotal = total;
    if (!window.lastPollTime) window.lastPollTime = Date.now();

    const now = Date.now();
    const delta = Math.max(0, total - window.prevTotal);
    const elapsed = (now - window.lastPollTime) / 1000; // seconds
    const rps = elapsed > 0 ? Math.round(delta / elapsed) : 0;

    window.prevTotal = total;
    window.lastPollTime = now;

    // Track threat delta for active threats (also per second)
    if (!window.prevThreats) window.prevThreats = threats;
    const activeThreatsDelta = Math.max(0, threats - window.prevThreats);
    const threatsPerSec = elapsed > 0 ? Math.round(activeThreatsDelta / elapsed) : 0;
    window.prevThreats = threats;

    // Get peak values from API (persisted across refreshes)
    const peakRps = stats.peak_rps_1min || 0;
    const peakBlocked = stats.peak_blocked_1min || 0;

    // Get hourly totals from API
    const hourTotal = stats.hour_total || 0;
    const hourBlocked = stats.hourly_blocked || 0;

    // Persist non-zero values for 3 seconds before dropping to zero
    if (rps > 0) {
      window.lastNonZeroRps = rps;
      window.lastNonZeroRpsTime = now;
    }
    if (threatsPerSec > 0) {
      window.lastNonZeroThreats = threatsPerSec;
      window.lastNonZeroThreatsTime = now;
    }

    // Show last non-zero value if it was within the last 3 seconds
    const displayRps = rps > 0 ? rps :
      (window.lastNonZeroRpsTime && now - window.lastNonZeroRpsTime < 3000 ? window.lastNonZeroRps : 0);
    const displayThreats = threatsPerSec > 0 ? threatsPerSec :
      (window.lastNonZeroThreatsTime && now - window.lastNonZeroThreatsTime < 3000 ? window.lastNonZeroThreats : 0);

    document.getElementById('stat-live').textContent = (displayRps || 0).toLocaleString();
    document.getElementById('stat-threats').textContent = (displayThreats || 0).toLocaleString();
    document.getElementById('stat-peak-rps').textContent = peakRps.toLocaleString();
    document.getElementById('stat-peak-blocked').textContent = peakBlocked.toLocaleString();
    document.getElementById('stat-hour-total').textContent = hourTotal.toLocaleString();
    document.getElementById('stat-hour-blocked').textContent = hourBlocked.toLocaleString();

  } catch (err) {
    console.error('Failed to fetch stats:', err);
  } finally {
    window.statsInFlight = false;
  }
}

setInterval(updateStats, 1000);
updateStats();
</script>

</body>
</html>
