<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L7 Protection Shield</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0e27;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

.bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0, 204, 255, 0.1) 0%, transparent 50%);
  z-index: 0;
  animation: bgShift 20s ease-in-out infinite;
}

@keyframes bgShift {
  0%, 100% { background-position: 0% 0%, 100% 100%; }
  50% { background-position: 100% 100%, 0% 0%; }
}

.container {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 900px;
  padding: 2rem;
}

header {
  margin-bottom: 4rem;
  animation: slideDown 0.8s ease;
}

.logo {
  font-size: 3.5rem;
  margin-bottom: 1rem;
  filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.5));
  animation: pulse-glow 2s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 255, 136, 0.5)); }
  50% { filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.8)); }
}

h1 {
  font-size: 2.5rem;
  font-weight: 700;
  background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}

.tagline {
  color: #8b949e;
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: 0.05em;
}

.hero-stat {
  background: linear-gradient(135deg, rgba(22, 27, 58, 0.6) 0%, rgba(31, 40, 73, 0.6) 100%);
  border: 1px solid rgba(0, 255, 136, 0.2);
  border-radius: 20px;
  padding: 4rem 3rem;
  margin-bottom: 3rem;
  backdrop-filter: blur(10px);
  animation: slideUp 0.8s ease;
  transition: all 0.3s ease;
}

.hero-stat:hover {
  border-color: rgba(0, 255, 136, 0.5);
  box-shadow: 0 0 30px rgba(0, 255, 136, 0.2), inset 0 0 30px rgba(0, 255, 136, 0.05);
  transform: translateY(-5px);
}

.hero-label {
  color: #8b949e;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 1rem;
  font-weight: 600;
}

.hero-value {
  font-size: 4.5rem;
  font-weight: 900;
  background: linear-gradient(135deg, #00ff88 0%, #00ccff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
  line-height: 1;
  text-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
}

.hero-description {
  color: #8b949e;
  font-size: 1rem;
  font-weight: 400;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
  margin-bottom: 3rem;
}

.stat-box {
  background: linear-gradient(135deg, rgba(22, 27, 58, 0.5) 0%, rgba(31, 40, 73, 0.5) 100%);
  border: 1px solid rgba(0, 255, 136, 0.15);
  border-radius: 12px;
  padding: 2rem;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  animation: slideUp 0.8s ease backwards;
}

.stat-box:nth-child(1) { animation-delay: 0.2s; }
.stat-box:nth-child(2) { animation-delay: 0.3s; }
.stat-box:nth-child(3) { animation-delay: 0.4s; }
.stat-box:nth-child(4) { animation-delay: 0.5s; }

.stat-box:hover {
  border-color: rgba(0, 255, 136, 0.4);
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.03);
  transform: translateY(-3px);
}

.stat-box-label {
  color: #8b949e;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.75rem;
  font-weight: 600;
}

.stat-box-value {
  font-size: 2rem;
  font-weight: 700;
  color: #00ff88;
  margin-bottom: 0.25rem;
}

.stat-box.danger .stat-box-value {
  color: #ff0055;
}

.stat-box.warning .stat-box-value {
  color: #d29922;
}

.footer {
  color: #6e7681;
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  animation: fadeIn 1s ease 0.8s backwards;
}

.status-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: #00ff88;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 1rem;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00ff88;
  animation: pulse 1.5s ease-in-out infinite;
  box-shadow: 0 0 10px #00ff88;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 768px) {
  h1 { font-size: 1.8rem; }
  .logo { font-size: 2.5rem; }
  .hero-value { font-size: 3rem; }
  .hero-stat { padding: 2.5rem 1.5rem; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
}

@media (max-width: 480px) {
  h1 { font-size: 1.5rem; }
  .logo { font-size: 2rem; }
  .hero-value { font-size: 2.2rem; }
  .hero-stat { padding: 2rem 1rem; }
  .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <header>
    <div class="logo">🛡️</div>
    <h1>L7 Protection</h1>
    <p class="tagline">Real-Time Defense Network</p>
  </header>

  <div class="hero-stat">
    <div class="hero-label">Threats Blocked Right Now</div>
    <div class="hero-value" id="threats-count">0</div>
    <div class="hero-description">Active threat mitigation in progress</div>
    <div class="status-indicator">
      <span class="pulse-dot"></span>
      Shield Active
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-box-label">Total Processed</div>
      <div class="stat-box-value" id="stat-total">0</div>
    </div>

    <div class="stat-box danger">
      <div class="stat-box-label">Blocked</div>
      <div class="stat-box-value" id="stat-blocked">0</div>
    </div>

    <div class="stat-box warning">
      <div class="stat-box-label">Rate Limited</div>
      <div class="stat-box-value" id="stat-ratelimit">0</div>
    </div>

    <div class="stat-box">
      <div class="stat-box-label">Success %</div>
      <div class="stat-box-value" id="stat-success-pct">0%</div>
    </div>
  </div>

  <div class="footer">
    <p>Powered by Envoy • Coraza WAF • Edge Guard</p>
  </div>
</div>

<script>
async function updateStats() {
  try {
    const resp = await fetch('/api/stats');
    if (!resp.ok) throw new Error('Stats API error');

    const data = await resp.json();
    const stats = data.stats || [];

    let total = 0, blocked = 0, ratelimited = 0, success = 0;

    for (const stat of stats) {
      const name = stat.name || '';
      const val = stat.value || 0;

      if (name.includes('edge_guard.requests_total')) total = val;
      if (name.includes('edge_guard.ip_blocked')) blocked += val;
      if (name.includes('edge_guard.ua_blocked')) blocked += val;
      if (name.includes('edge_guard.suspicious_blocked')) blocked += val;
      if (name.includes('edge_guard.rate_limited')) ratelimited = val;
      if (name.includes('https_edge.downstream_rq_2xx')) success = val;
    }

    const successPct = total > 0 ? Math.round((success / total) * 100) : 0;
    const threatsBlocked = blocked + ratelimited;

    document.getElementById('threats-count').textContent = threatsBlocked.toLocaleString();
    document.getElementById('stat-total').textContent = total.toLocaleString();
    document.getElementById('stat-blocked').textContent = blocked.toLocaleString();
    document.getElementById('stat-ratelimit').textContent = ratelimited.toLocaleString();
    document.getElementById('stat-success-pct').textContent = successPct + '%';

  } catch (err) {
    console.error('Failed to fetch stats:', err);
  }
}

setInterval(updateStats, 2000);
updateStats();
</script>

</body>
</html>
