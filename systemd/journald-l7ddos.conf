# Journald config for l7ddos services
# Install to /etc/systemd/journald.conf.d/l7ddos.conf
# Then run: sudo systemctl restart systemd-journald

[Journal]
# Limit logs for l7ddos services to 2 hours
MaxRetentionSec=2h

# Cap total journal size at 500MB
SystemMaxUse=500M

# Rotate logs when they hit 50MB
SystemMaxFileSize=50M

# Keep only 2 rotated files
SystemMaxFiles=2
